<button class="btn o s" id="lg" type="button">मराठी</button><button class="btn o s" id="th" type="button">Theme</button></div>

</main>

'Find my ward':'माझा प्रभाग शोधा','Select ward':'प्रभाग निवडा','Select a ward to see published water distribution schedules.':'प्रकाशित पाणीपुरवठा वेळापत्रके पाहण्यासाठी प्रभाग निवडा.','Only published schedules are shown. Times are planned; actual supply may vary. Operator details are not public.':'फक्त प्रकाशित वेळापत्रके दाखवली आहेत. वेळा नियोजित आहेत; प्रत्यक्ष पुरवठा बदलू शकतो. ऑपरेटरचा तपशील सार्वजनिक नाही.',
'GeoJSON data (publish approved network data)':'GeoJSON डेटा (मंजूर जाळे डेटा प्रकाशित करा)','Each feature needs properties: type (ward, zone, pipeline, valve, tank, pump), a unique id, and optionally name, verified (draft, under_review, verified, rejected), zone/ward, dia, material. Wards and zones are Polygons, pipelines are LineStrings, other assets are Points. Coordinates: longitude/latitude (WGS84).':'प्रत्येक घटकासाठी properties आवश्यक: type (ward, zone, pipeline, valve, tank, pump), अद्वितीय id, तसेच पर्यायी name, verified (draft, under_review, verified, rejected), zone/ward, dia, material. प्रभाग व क्षेत्रे Polygon, जलवाहिन्या LineString, इतर मालमत्ता Point असाव्यात. निर्देशांक: रेखांश/अक्षांश (WGS84).',
'Paste FeatureCollection':'FeatureCollection येथे पेस्ट करा','Validate & import (replaces current data)':'तपासा व आयात करा (सध्याचा डेटा बदलला जाईल)','Export current':'सध्याचा निर्यात करा','Reset to demo':'डेमोवर रीसेट करा','Enforce operating window for session start (administrator setting)':'सत्र सुरू करण्यासाठी वेळेची मर्यादा लागू करा (प्रशासक सेटिंग)','Audit log (latest 40)':'ऑडिट नोंद (अलीकडील 40)','This log lives in the browser. A production system needs an append-only server-side audit trail.':'ही नोंद ब्राउझरमध्ये आहे. प्रत्यक्ष प्रणालीसाठी सर्व्हरवरील केवळ-जोडता-येणारा ऑडिट आवश्यक आहे.','Not valid JSON.':'वैध JSON नाही.','Must be a GeoJSON FeatureCollection with at least one feature.':'किमान एक घटक असलेला GeoJSON FeatureCollection असणे आवश्यक आहे.',
'Demo Tank':'डेमो टाकी','Demo Pumping Station':'डेमो पंपिंग स्टेशन','Valve Main (shared)':'मुख्य व्हॉल्व्ह (सामायिक)','Main A':'मुख्य A'};
const ACT={submit:'सादर करा',approve:'मंजूर करा',reject:'नाकारा',publish:'प्रकाशित करा',cancel:'रद्द करा',start:'सुरू केले',pause:'थांबवले',resume:'पुन्हा सुरू',stop:'बंद केले'};
const RX=[[/^(Ward|Zone|Pipeline|Valve|Tank|Pump)s \((\d+)\)$/,(m,a,b)=>MR[a.toLowerCase()]+' ('+b+')'],[/^Pipeline, valve, tank and pump register \((\d+)\)$/,'जलवाहिनी, व्हॉल्व्ह, टाकी व पंप नोंदवही ($1)'],
[/^([\d.]+) km$/,'$1 किमी'],[/^(\d+) m$/,'$1 मी'],[/^Demo Ward (\d+)$/,'डेमो प्रभाग $1'],[/^Demo Zone (\w+)$/,'डेमो क्षेत्र $1'],[/^Valve (\w+)$/,'व्हॉल्व्ह $1'],[/^Branch (\w+)$/,'शाखा $1'],
[/^Missing or duplicate id: (.*)$/,'आयडी नाही किंवा पुनरावृत्त: $1'],[/^(.+): (ward|zone|pipeline|valve|tank|pump) must be a (Polygon|LineString|Point)\.$/,(m,a,b,c)=>a+': '+MR[b]+' हे '+c+' असणे आवश्यक आहे.'],
[/^(.+): invalid coordinates\.$/,'$1: निर्देशांक अवैध आहेत.'],[/^(.+): polygon ring needs at least 4 points\.$/,'$1: बहुभुज रिंगसाठी किमान 4 बिंदू आवश्यक आहेत.'],[/^Each feature needs properties\.type in: (.*)\.$/,'प्रत्येक घटकास properties.type आवश्यक आहे: $1.'],
[/^Imported (\d+) features\. Schedules referencing missing zones were removed\. Unverified features are marked draft\.$/,'आयात केले: $1 घटक. नसलेल्या क्षेत्रांशी संबंधित वेळापत्रके काढली. असत्यापित घटक "मसुदा" म्हणून चिन्हांकित.'],
[/^✓ Done: (\w+)$/,(m,a)=>'✓ पूर्ण: '+(ACT[a]||a)],[/✓ Draft (S-\d+) created\./,'✓ मसुदा $1 तयार केला.'],[/ Warning: zone is not verified\./,' इशारा: क्षेत्र सत्यापित नाही.'],[/ Conflicts detected \(must be resolved before submit\): /,' संघर्ष आढळले (सादर करण्यापूर्वी सोडवा): '],
[/^Conflict: /,'संघर्ष: '],[/(S-\d+): operator (\S+) already assigned ([\d:–-]+)/g,'$1: ऑपरेटर $2 ला $3 साठी आधीच नियुक्त केले आहे'],[/(S-\d+): shared valve (.+?) used ([\d:–-]+)/g,'$1: सामायिक व्हॉल्व्ह $2 $3 वापरात आहे'],[/Blocked: valve in use by active session (S-\d+)\./,'अवरोधित: व्हॉल्व्ह सक्रिय सत्र $1 मध्ये वापरात आहे.'],[/ \(running\)/,' (सुरू आहे)']];
function trs(s){if(MR[s])return MR[s];let o=s;for(const[r,f]of RX)o=o.replace(r,f);return o}
let lang=ld('lm_lang','en'),theme=ld('lm_theme',null);const orig=new WeakMap(),AT=['placeholder','aria-label','title'];
function xt(n){const v=n.nodeValue,b=orig.has(n)?orig.get(n):v,t=b.trim();if(lang==='mr'&&t){const r=trs(t);if(r!==t){if(!orig.has(n))orig.set(n,v);n.nodeValue=b.replace(t,()=>r)}}else if(orig.has(n)){n.nodeValue=orig.get(n);orig.delete(n)}}
function xa(e){e._en=e._en||{};for(const a of AT){if(!e.hasAttribute||!e.hasAttribute(a))continue;const b=e._en[a]??e.getAttribute(a);e._en[a]=b;e.setAttribute(a,lang==='mr'?(trs(b)):b)}}
function walk(root){if(root.nodeType===3){if(!['TEXTAREA','SCRIPT','STYLE'].includes(root.parentNode?.tagName))xt(root);return}if(root.nodeType!==1)return;xa(root);const w=document.createTreeWalker(root,5);let n;while((n=w.nextNode())){if(n.nodeType===3){if(!['TEXTAREA','SCRIPT','STYLE'].includes(n.parentNode?.tagName))xt(n)}else xa(n)}}
function applyTheme(){const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches,b=$('#th'),m=lang==='mr';document.documentElement.dataset.theme=dark?'dark':'light';b.textContent=(dark?'☀ ':'☾ ')+(m?(dark?'प्रकाश':'गडद'):(dark?'Light':'Dark'));b.setAttribute('aria-label',m?(dark?'प्रकाश मोडवर जा':'गडद मोडवर जा'):(dark?'Switch to light mode':'Switch to dark mode'))}
function setLang(l){lang=l;sv('lm_lang',l);document.documentElement.lang=l;document.title=l==='mr'?'लातूर महानगरपालिका — जल जाळे डेटा व वितरण पोर्टल':'Latur Municipal Corporation — Water Network Data & Distribution Portal';
 $('#lg').textContent=l==='mr'?'English':'मराठी';$('#lg').setAttribute('aria-label',l==='mr'?'Switch to English':'मराठीत बदला');applyTheme();walk(document.body);render()}
$('#th').onclick=()=>{theme=document.documentElement.dataset.theme==='dark'?'light':'dark';sv('lm_theme',theme);applyTheme();render()};
$('#lg').onclick=()=>setLang(lang==='mr'?'en':'mr');
/*INIT*/
bounds();new MutationObserver(ms=>{if(lang!=='mr')return;ms.forEach(m=>m.addedNodes.forEach(walk))}).observe(document.body,{childList:true,subtree:true});setLang(lang);
